name: Build and deploy Flutter Web

on:
  push:
    branches:
      - feature/student-enrollment

permissions:
  contents: read

concurrency:
  group: lightsail-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Flutter Web release
        run: flutter build web --release --dart-define=APP_VERSION=${GITHUB_SHA}

      - name: Package Web build
        run: |
          cd build/web
          zip -r ../../student_directory_web.zip .

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Trust Lightsail host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload Web build
        run: |
          scp student_directory_web.zip \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/tmp/student_directory_web.zip"

      - name: Configure server and deploy Web build
        run: |
          ssh "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "DEPLOY_ID=${GITHUB_SHA} bash -s" <<'EOF'
          set -e

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx unzip

          sudo mkdir -p /var/www/student_directory/releases
          release_dir="/var/www/student_directory/releases/${DEPLOY_ID:-manual}"
          sudo rm -rf "$release_dir"
          sudo mkdir -p "$release_dir"
          sudo unzip -q -o /tmp/student_directory_web.zip -d "$release_dir"
          sudo chown -R www-data:www-data "$release_dir"
          sudo ln -sfn "$release_dir" /var/www/student_directory/current

          printf '%s\n' \
            'server {' \
            '    listen 80 default_server;' \
            '    listen [::]:80 default_server;' \
            '    server_name _;' \
            '    root /var/www/student_directory/current;' \
            '' \
            '    index index.html;' \
            '' \
            '    location / {' \
            '        try_files $uri $uri/ /index.html;' \
            '    }' \
            '}' | sudo tee /etc/nginx/sites-available/student_directory >/dev/null

          sudo ln -sfn /etc/nginx/sites-available/student_directory /etc/nginx/sites-enabled/student_directory
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo chown -R www-data:www-data /var/www/student_directory
          sudo nginx -t
          sudo systemctl enable --now nginx
          sudo systemctl restart nginx
          curl --fail --silent --show-error http://127.0.0.1/ | grep -q 'flutter_bootstrap.js'
          sudo rm -f /tmp/student_directory_web.zip
          EOF
